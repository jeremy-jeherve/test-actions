name: "Changelog entry"
on:
  pull_request:
    # The specific activity types are listed here to include "labeled" and "unlabeled"
    # (which are not included by default for the "pull_request" trigger).
    # This is needed to allow skipping enforcement of the changelog in PRs with specific labels,
    # as defined in the (optional) "skipLabels" property.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

jobs:
  # Enforces the addition of a changelog entry (a file in the .github/changelog directory) every pull request.
  changelog:
    runs-on: ubuntu-latest
    steps:
      # Allow skipping the changelog if the PR includes the label "Skip Changelog".
      - name: "Check for Skip Changelog label"
        id: hasSkipLabel
        uses: actions/github-script@v7
        with:
          script: |
            const { payload : { pull_request : { number, labels } } } = context;
            const skipLabel = 'Skip Changelog';
            const prLabels = labels.map( label => label.name );
            const hasSkipLabel = prLabels.includes( skipLabel );

            if ( hasSkipLabel ) {
              core.info( `Skipping changelog requirement for this PR (#${ number } because of the "${ skipLabel }" label.` );
            }
            core.setOutput( 'hasSkipLabel', hasSkipLabel.toString() );

      # Check if the PR includes a new added file in the .github/changelog directory.
      - name: "Check if the PR includes a new added file in the .github/changelog directory"
        uses: actions/github-script@v7
        with:
            script: |
                const { payload : { pull_request : { number, files } } } = context;
                const changelogDir = '.github/changelog';
                const hasNewChangelogFile = files.some( file => {
                    core.info( `Checking file: ${ file.filename }, with status ${ file.status }` );
                    if ( file.filename.startsWith( changelogDir ) && file.status === 'added' ) {
                        core.info( `Found new changelog file: ${ file.filename }` );
                        return true;
                    }
                    return false;
                } );
                
                if ( hasNewChangelogFile ) {
                    core.info( `PR #${ number } includes a new changelog file.` );
                } else {
                    core.info( `PR #${ number } does not include a new changelog file.` );
                    core.setFailed( `PR #${ number } does not include a new changelog file.` );
                }
                
                
        
    
        

